# Stack "MarketPlace Analytics" branchée sur les vraies données TCGWorld.
# Orchestration par scripts Python simples (scripts/), pas par Airflow — voir README.md.
# Lancement : docker compose -f data-platform/docker-compose.yml --env-file data-platform/.env up -d

services:
  postgres-dwh:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: ${DWH_USER:-dwh_user}
      POSTGRES_PASSWORD: ${DWH_PASSWORD:-dwh_password}
      POSTGRES_DB: ${DWH_DB:-dwh}
    ports:
      - "5433:5432"
    volumes:
      - pg-dwh-data:/var/lib/postgresql
      - ./init-db:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${DWH_USER:-dwh_user}", "-d", "${DWH_DB:-dwh}"]
      interval: 5s
      retries: 10
    networks:
      - data-platform-net

  minio:
    image: quay.io/minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minio_admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minio_password_2026}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      retries: 10
    networks:
      - data-platform-net

  minio-init:
    image: quay.io/minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: /bin/sh
    command:
      - -c
      - |
        mc alias set local http://minio:9000 "${MINIO_ROOT_USER:-minio_admin}" "${MINIO_ROOT_PASSWORD:-minio_password_2026}"
        mc mb -p local/data-lake || true
        mc anonymous set download local/data-lake || true
    networks:
      - data-platform-net

  metabase:
    image: metabase/metabase:v0.59.6.1
    ports:
      - "3000:3000"
    environment:
      MB_DB_TYPE: h2
      MB_DB_FILE: /metabase-data/metabase.db
    volumes:
      - metabase-data:/metabase-data
    depends_on:
      - postgres-dwh
    networks:
      - data-platform-net

  # ── Bonus observabilité (Could have, +10 pts, §13 du cahier des charges) ──
  # Adapté : plus de métriques Airflow/StatsD (pas d'Airflow ici), seulement les
  # métriques PostgreSQL du DWH.
  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    networks:
      - data-platform-net

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3001:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - data-platform-net

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:latest
    environment:
      DATA_SOURCE_NAME: postgresql://${DWH_USER:-dwh_user}:${DWH_PASSWORD:-dwh_password}@postgres-dwh:5432/${DWH_DB:-dwh}?sslmode=disable
    ports:
      - "9187:9187"
    depends_on:
      - postgres-dwh
    networks:
      - data-platform-net

networks:
  data-platform-net:
    driver: bridge

volumes:
  pg-dwh-data:
  minio-data:
  metabase-data:
  prometheus-data:
  grafana-data:
